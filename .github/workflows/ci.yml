name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:5d0147dc25c78f8cc2b9861ff8f5c9b4a41419ed60a9ce2217de5a215270b42b \
            detect --source=/repo --redact --verbose --exit-code=1 --log-opts=--all

  test:
    name: Python ${{ matrix.python-version }} and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.python-version == '3.13'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Check commit subjects
        if: matrix.python-version == '3.13'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python scripts/check_commit_messages.py "FETCH_HEAD..HEAD"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              python scripts/check_commit_messages.py HEAD
            else
              python scripts/check_commit_messages.py "$before..${{ github.sha }}"
            fi
          fi

      - name: Check pull request title
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_commit_messages.py --subject-env PR_TITLE

      - name: Check workflow dependency pins
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          invalid = []
          workflow_paths = sorted(Path(".github/workflows").glob("*.yml"))
          workflow_paths += sorted(Path(".github/workflows").glob("*.yaml"))
          for path in workflow_paths:
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s@]+)@([^\s#]+)", line)
                  if not match or match.group(1).startswith("./"):
                      continue
                  if not re.fullmatch(r"[0-9a-f]{40}", match.group(2)):
                      invalid.append(f"{path}:{line_number}: {match.group(0)}")
          if invalid:
              print("Workflow actions must use full commit SHAs:", file=sys.stderr)
              print("\n".join(invalid), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Install frontend dependencies
        if: matrix.python-version == '3.13'
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check frontend
        if: matrix.python-version == '3.13'
        working-directory: web
        run: npm run check

      - name: Test frontend
        if: matrix.python-version == '3.13'
        working-directory: web
        run: npm test

      - name: Build frontend
        if: matrix.python-version == '3.13'
        working-directory: web
        run: npm run build

      - name: Test Python services
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q server scripts vrchat_monitor

      - name: Validate plist templates
        run: python -c "import pathlib, plistlib; [plistlib.loads(path.read_bytes()) for path in pathlib.Path('ops').glob('*.plist.template')]"

      - name: Validate Compose model
        if: matrix.python-version == '3.13'
        run: docker compose config --quiet

  macos-smoke:
    name: macOS smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test macOS-facing code
        run: |
          python -m unittest discover -s tests -v
          zsh -n ./*.command
          python -c "import pathlib, plistlib; [plistlib.loads(path.read_bytes()) for path in pathlib.Path('ops').glob('*.plist.template')]"

  backup-worker:
    name: R2 backup Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/r2-backup-worker/package-lock.json
      - name: Install locked Worker dependencies
        working-directory: infra/r2-backup-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check append-only Worker source
        working-directory: infra/r2-backup-worker
        run: npm run check
      - name: Test R2 gateway contracts
        working-directory: infra/r2-backup-worker
        run: npm test

  container:
    name: Build container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate operational image platforms
        run: |
          cloudflared_image="$(docker compose --profile tunnel config --images | awk '/^cloudflare\/cloudflared:/ { print; exit }')"
          test -n "$cloudflared_image"
          docker buildx imagetools inspect "$cloudflared_image" --raw | python -c '
          import json
          import sys

          manifest = json.load(sys.stdin)
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in manifest.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = required - platforms
          if missing:
              raise SystemExit(f"cloudflared image is missing platforms: {sorted(missing)}")
          '
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          github-token: ""
          load: true
          platforms: linux/amd64
          push: false
          provenance: false
          tags: presence-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan container for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: presence-monitor:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
